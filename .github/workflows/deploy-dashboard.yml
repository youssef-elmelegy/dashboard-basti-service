name: Deploy dashboard

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: deploy-dashboard
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          VITE_API_BASE_URL: https://api.basty.ly/api
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: pnpm run build

      - name: Configure SSH agent with deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust the server host key
        run: ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Upload + extract dist on server
        # Stream a tarball over ssh and extract into /var/www/dashboard/
        # /var/www/dashboard is owned by elmelegy:caddy so no sudo needed.
        run: |
          tar -C dist -czf - . | \
            ssh -o StrictHostKeyChecking=no \
              elmelegy@${{ secrets.SERVER_HOST }} \
              'set -e; rm -rf /var/www/dashboard/* /var/www/dashboard/.[!.]* 2>/dev/null || true; tar -C /var/www/dashboard -xzf -'

      - name: Verify dashboard responds
        run: |
          ssh -o StrictHostKeyChecking=no elmelegy@${{ secrets.SERVER_HOST }} \
            'curl -fsS -H "Host: dashboard.basty.ly" http://127.0.0.1/ -o /dev/null && echo OK'
