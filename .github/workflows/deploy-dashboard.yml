name: Deploy dashboard

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: deploy-dashboard
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          VITE_API_BASE_URL: https://api.basty.ly/api
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_SENTRY_RELEASE: basti-dashboard@${{ github.sha }}
        run: pnpm run build

      # The build emits sourcemaps (vite build.sourcemap: "hidden") purely so
      # they can be uploaded here. They are stripped from dist/ in the next step
      # so they are never served from the public webroot.
      #
      # Uses sentry-cli rather than hand-rolled curl: it is the upload path
      # GlitchTip documents, and it handles release creation and the
      # project-scoped files endpoint.
      #
      # Pinned to sentry-cli 2.x ON PURPOSE. v3 removed `releases files` and
      # uploads only via the newer artifactbundle/assemble flow, which GlitchTip
      # does not implement (glitchtip-backend#299) — it would 404 on every
      # deploy. 2.x keeps the legacy release-files flow GlitchTip supports.
      - name: Upload sourcemaps to GlitchTip
        # Never block a deploy on error reporting: a failed upload only costs
        # trace readability. The verify step below turns it into a visible
        # warning rather than a silent no-op.
        continue-on-error: true
        id: sourcemaps
        env:
          SENTRY_URL: https://glitchtip.basty.ly
          SENTRY_ORG: basti-backend
          SENTRY_PROJECT: basti-dashboard
          SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
          VERSION: basti-dashboard@${{ github.sha }}
        run: |
          set -o pipefail
          CLI="npx --yes @sentry/cli@2.42.2"

          # Idempotent: succeeds whether or not the release already exists.
          $CLI releases new "$VERSION"

          # --url-prefix '~/' matches any host, so maps resolve regardless of
          # the domain serving the JS. Vite emits chunks and their .map files
          # into dist/assets.
          $CLI releases files "$VERSION" upload-sourcemaps dist \
            --url-prefix '~/'

          # Fail the step if nothing landed. Without this an upload that
          # silently no-ops (e.g. server file storage not configured) would
          # look identical to success.
          $CLI releases files "$VERSION" list | tee /tmp/gt-files.txt
          grep -q '\.map' /tmp/gt-files.txt \
            || { echo "no .map artifacts registered on the release"; exit 1; }

      - name: Warn if sourcemap upload failed
        if: steps.sourcemaps.outcome != 'success'
        run: |
          echo "::warning::Sourcemap upload to GlitchTip failed. Errors will still \
          be reported, but production stack traces will be minified. Check that the \
          GlitchTip instance has file storage configured and that \
          GLITCHTIP_AUTH_TOKEN has project write scope."

      - name: Strip sourcemaps before deploy
        # Must run before the tar below: /var/www/dashboard is public, so any
        # .map left in dist/ would expose the app's original source.
        run: find dist -name '*.map' -delete

      - name: Configure SSH agent with deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust the server host key
        run: ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Upload + extract dist on server
        # Stream a tarball over ssh and extract into /var/www/dashboard/
        # /var/www/dashboard is owned by elmelegy:caddy so no sudo needed.
        run: |
          tar -C dist -czf - . | \
            ssh -o StrictHostKeyChecking=no \
              elmelegy@${{ secrets.SERVER_HOST }} \
              'set -e; rm -rf /var/www/dashboard/* /var/www/dashboard/.[!.]* 2>/dev/null || true; tar -C /var/www/dashboard -xzf -'

      - name: Verify dashboard responds
        run: |
          ssh -o StrictHostKeyChecking=no elmelegy@${{ secrets.SERVER_HOST }} \
            'curl -fsS -H "Host: dashboard.basty.ly" http://127.0.0.1/ -o /dev/null && echo OK'

      - name: Notify GlitchTip of new release
        if: success()
        env:
          GT_ORG: basti-backend
          PROJECT: basti-dashboard
          VERSION: basti-dashboard@${{ github.sha }}
          TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
        run: |
          curl -fsS -X POST "https://glitchtip.basty.ly/api/0/organizations/$GT_ORG/releases/" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"version\":\"$VERSION\",
              \"projects\":[\"$PROJECT\"],
              \"refs\":[{\"repository\":\"${{ github.repository }}\",\"commit\":\"${{ github.sha }}\"}]
            }" || echo "::warning::release create returned non-2xx (may already exist)"

          curl -fsS -X POST "https://glitchtip.basty.ly/api/0/organizations/$GT_ORG/releases/$VERSION/deploys/" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"environment\":\"production\",\"name\":\"GitHub Actions ${{ github.run_id }}\"}" \
            || echo "::warning::deploy create returned non-2xx"
